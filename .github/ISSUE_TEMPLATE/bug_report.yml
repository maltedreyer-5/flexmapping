name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste `.env` files, database dumps, log excerpts containing
        credentials, or API keys.** Replace hostnames and keys with
        placeholders before submitting.

        For security findings, do not open an issue. See
        [SECURITY.md](../../SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `curl -s http://localhost:8000/health`
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose (default)
        - Docker Compose with the development override
        - Manual, without Docker
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect, and where is that documented?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        The exact commands or interface actions. If a category configuration is
        involved, attach the relevant part of the YAML file.
    validations:
      required: true

  - type: textarea
    id: pipeline
    attributes:
      label: Pipeline state
      description: |
        For anything involving crawling, extraction or generation. Redact
        hostnames if necessary.
      value: |
        ```
        # Source status
        docker compose exec db psql -U flexmap -d flexmap \
          -c "select status, count(*) from sources group by status"

        # Queue
        curl -s -u <user>:<password> http://localhost:8000/admin/recovery/queue-status
        ```

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        `docker compose logs --tail 100 app worker`. Remove credentials and
        internal hostnames.
      render: text

  - type: input
    id: llm
    attributes:
      label: LLM backend
      description: |
        Which server and which model, if the issue concerns extraction,
        validation or translation quality. No endpoint URL needed.
