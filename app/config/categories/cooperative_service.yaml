      - Länger als 80 Wörter
      
      Bei zu langem Text: Auf 1-2 Sätze kürzen!
      
      Antwort:
      QUALITY: [HIGH|MEDIUM|LOW|INSUFFICIENT]
      SCORE: [0.0-1.0]
      NOTES: [Begründung]
      RESULT: [Kurze Beschreibung, "Nicht angegeben" oder "INSUFFICIENT"]

  # ===== GRUPPE: KONTAKT =====
  - internal_name: contact_info
    display_name: Kontakt
    display_name_en: Contact Information
    field_group: contact
    field_type: text
    required_confidence: 0.5
    translatable: false
    extract_prompt: |
