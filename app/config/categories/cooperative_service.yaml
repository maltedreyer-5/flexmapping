      Antwort:
      QUALITY: [HIGH|MEDIUM|LOW|INSUFFICIENT]
      SCORE: [0.0-1.0]
      NOTES: [Begründung]
      RESULT: [Echte Kontaktdaten, "Nicht angegeben" oder "INSUFFICIENT"]

