      - Hybrid
      
      Falls nicht erkennbar: "Nicht angegeben"
    validate_prompt: |
      Validiere den Plattformtyp: "{raw_result}"
      
      Erlaubt: Open Source, Kommerziell, Eigenentwicklung, Hybrid, Nicht angegeben
      
      Antwort:
      QUALITY: [HIGH|MEDIUM|LOW|INSUFFICIENT]
      SCORE: [0.0-1.0]
      NOTES: [Begründung]
      RESULT: [Typ, "Nicht angegeben" oder "INSUFFICIENT"]

  - internal_name: data_location
    display_name: Datenstandort
    display_name_en: Data Location
    field_group: technical
    field_type: text
    required_confidence: 0.5
    translatable: true
    extract_prompt: |
      Extrahiere den Datenstandort dieses Dienstes.
      
      Suche nach: Serverstandort, "Daten in Deutschland", Rechenzentrum
      
      Falls nicht erkennbar: "Nicht angegeben"
      
      Format: Ortsangabe (z.B. "Rechenzentrum Münster, NRW")
    validate_prompt: |
      Validiere den Datenstandort: "{raw_result}"
      
      ABLEHNEN wenn:
