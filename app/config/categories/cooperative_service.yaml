  - internal_name: interfaces
    display_name: Schnittstellen
    display_name_en: Interfaces
    field_group: technical
    field_type: list
    required_confidence: 0.4
    translatable: false
    extract_prompt: |
      Extrahiere technische Schnittstellen dieses Dienstes.
      
      Gültige Schnittstellen:
      - Authentifizierung: DFN-AAI, Shibboleth, SAML, LDAP, OAuth
      - Dateizugriff: WebDAV, SFTP, SMB
      - APIs: REST-API, GraphQL, SOAP
      - Clients: Desktop-Client, Mobile-App
      
      WICHTIG:
      - NUR technische Schnittstellen
      - KEIN JSON-Format!
      
      Falls nicht erkennbar: Nicht angegeben
      
      Format:
      - Schnittstelle1
      - Schnittstelle2
    validate_prompt: |
      Validiere die Schnittstellen: "{raw_result}"
      
      STRENG ABLEHNEN wenn:
      - JSON-Format
      - Nur "-" ohne weitere Angaben
      - Generische Begriffe
      
      Falls nur "-": Ersetze durch "Nicht angegeben"
      Falls JSON: Konvertiere zu Liste!
      
      Antwort:
      QUALITY: [HIGH|MEDIUM|LOW|INSUFFICIENT]
      SCORE: [0.0-1.0]
      NOTES: [Begründung]
      RESULT: [Liste, "Nicht angegeben" oder "INSUFFICIENT"]

  # ===== GRUPPE: SERVICE =====
  - internal_name: service_features
    display_name: Leistungsumfang
    display_name_en: Service Features
    field_group: service
    field_type: text
    required_confidence: 0.5
    translatable: true
    extract_prompt: |
      Extrahiere den konkreten Leistungsumfang (max. 2-3 Sätze).
      
      Suche nach: Speichervolumen, Funktionen, Limits, Service-Level
      
      Falls nicht erkennbar: "Nicht angegeben"
      
      Format: Kurze, konkrete Angaben
      Beispiel: "30 GB Speicher für Studierende, bis zu 500 GB für Beschäftigte"
      
      NICHT: Meta-Aussagen wie "Alle Angaben sind korrekt"
    validate_prompt: |
      Validiere den Leistungsumfang: "{raw_result}"
      
      STRENG ABLEHNEN wenn:
      - Platzhalter wie "Der Leistungsumfang"
      - Meta-Aussagen wie "Alle Angaben sind korrekt", "ist ableitbar"
      - Keine konkreten Zahlen oder Funktionen
      
      Antwort:
      QUALITY: [HIGH|MEDIUM|LOW|INSUFFICIENT]
      SCORE: [0.0-1.0]
      NOTES: [Begründung]
      RESULT: [Konkrete Angaben, "Nicht angegeben" oder "INSUFFICIENT"]

  - internal_name: support_info
    display_name: Support-Angebot
    display_name_en: Support Information
    field_group: service
    field_type: text
    required_confidence: 0.4
    translatable: true
    extract_prompt: |
      Extrahiere Support-Informationen (max. 1-2 Sätze).
      
      Suche nach: Helpdesk, E-Mail-Support, FAQ
      
      Falls nicht erkennbar: "Nicht angegeben"
      
      Format: Kurze Beschreibung als Fließtext (KEINE Markdown-Listen!)
      Beispiel: "E-Mail-Support über fdm@uni.de, FAQ auf der Website verfügbar"
      
      NICHT: Lange Listen mit Spiegelstrichen oder Markdown-Formatierung
    validate_prompt: |
      Validiere das Support-Angebot: "{raw_result}"
      
      STRENG ABLEHNEN wenn:
      - Platzhalter wie "Das Support-Angebot"
      - Länger als 100 Wörter
      
      Bei zu langem Text oder Markdown-Listen: Auf 1-2 Sätze Fließtext kürzen!
      
      Antwort:
      QUALITY: [HIGH|MEDIUM|LOW|INSUFFICIENT]
      SCORE: [0.0-1.0]
      NOTES: [Begründung]
      RESULT: [Kurze Beschreibung, "Nicht angegeben" oder "INSUFFICIENT"]

