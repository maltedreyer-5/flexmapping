<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in &middot; FlexMapping</title>
    <link rel="stylesheet" href="/admin-ui/static/vendor/tailwind.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="bg-white shadow-sm border border-gray-200 rounded-lg p-8">
            <div class="mb-6">
                <h1 class="text-xl font-bold text-gray-900">FlexMapping</h1>
                <p class="text-sm text-gray-500 mt-1">Sign in to continue</p>
            </div>

            {% if error %}
            <div class="mb-4 px-3 py-2 rounded bg-red-50 border border-red-200 text-sm text-red-800">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/admin-ui/login" class="space-y-4">
                <input type="hidden" name="next" value="{{ next }}">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input id="username" name="username" type="text" required autofocus autocomplete="username"
                           class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password"
                           class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 rounded">
                    Sign in
                </button>
            </form>
        </div>
    </div>
</body>
</html>
