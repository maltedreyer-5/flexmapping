services:
  # PostgreSQL: reachable only from the Compose network. No host port is
  # published; use `docker compose exec db psql` or the dev override.
  db:
    image: postgres:15-alpine
    container_name: flexmap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flexmap
      POSTGRES_USER: flexmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks: [flexmap]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexmap -d flexmap"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis: queue and cache. Also not published to the host.
  redis:
    image: redis:7-alpine
    container_name: flexmap-redis
    restart: unless-stopped
    command: >
      sh -c 'redis-server --appendonly yes --appendfsync everysec
      ${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks: [flexmap]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # FastAPI application: admin UI, admin API, public API, site generator.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flexmap-app
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://flexmap:${POSTGRES_PASSWORD}@db:5432/flexmap
      - DATABASE_URL_SYNC=postgresql://flexmap:${POSTGRES_PASSWORD}@db:5432/flexmap
      # The generated site goes into the shared volume below. Without this the
      # application writes inside the container and the mount stays empty.
      - PUBLIC_SITE_DIR=/var/www/flexmap
      - API_HOST=0.0.0.0
      - API_PORT=8000
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./public:/var/www/flexmap
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
      - ./public_templates:/app/public_templates:ro
    networks: [flexmap]
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Background worker: crawl, extract, validate, normalize, translate, generate.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flexmap-worker
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://flexmap:${POSTGRES_PASSWORD}@db:5432/flexmap
      - DATABASE_URL_SYNC=postgresql://flexmap:${POSTGRES_PASSWORD}@db:5432/flexmap
      - PUBLIC_SITE_DIR=/var/www/flexmap
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      app: {condition: service_started}
    volumes:
      - ./public:/var/www/flexmap
      - ./app:/app/app:ro
      - ./public_templates:/app/public_templates:ro
    networks: [flexmap]
    command: ["python", "-m", "app.worker"]

volumes:
  postgres_data: {driver: local}
  redis_data: {driver: local}

networks:
  flexmap: {driver: bridge}
